# HomeLib 本地开发环境配置
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homelib-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=HomeLib
      - APP_VERSION=1.0.0
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///app/data/homelib.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backend:/app  # 热重载：挂载代码目录
    networks:
      - homelib-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: homelib-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app  # 热重载
      - /app/node_modules  # 不覆盖 node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - homelib-network
    command: npm run dev -- --host 0.0.0.0

networks:
  homelib-network:
    driver: bridge
