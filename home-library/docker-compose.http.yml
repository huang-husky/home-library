# HomeLib 无 SSL 快速部署配置（用于测试或内网）
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homelib-backend
    restart: unless-stopped
    environment:
      - APP_NAME=HomeLib
      - APP_VERSION=1.0.0
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///app/data/homelib.db
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - homelib-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: homelib-frontend
    restart: unless-stopped
    networks:
      - homelib-network

  nginx:
    image: nginx:alpine
    container_name: homelib-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.http.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - homelib-network

networks:
  homelib-network:
    driver: bridge
