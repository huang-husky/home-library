# HomeLib 生产环境部署配置
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homelib-backend
    restart: unless-stopped
    environment:
      - APP_NAME=HomeLib
      - APP_VERSION=1.0.0
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///app/data/homelib.db
      - CORS_ORIGINS=https://${DOMAIN},https://www.${DOMAIN}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - homelib-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: homelib-frontend
    restart: unless-stopped
    networks:
      - homelib-network

  nginx:
    image: nginx:alpine
    container_name: homelib-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/var/www/uploads:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - homelib-network

  # 可选：使用 Certbot 自动获取 SSL 证书
  certbot:
    image: certbot/certbot
    container_name: homelib-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - homelib-network

networks:
  homelib-network:
    driver: bridge

volumes:
  certbot-data:
  certbot-www:
